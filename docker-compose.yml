services:
  db:
    image: postgres:16
    container_name: tura_limpia_db
    environment:
      POSTGRES_DB: tura_limpia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tura_limpia"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
